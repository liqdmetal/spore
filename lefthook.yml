# lefthook — pre-push runs the FULL local gate suite (scripts/gates.sh):
# gofmt/goimports, go build+vet+test, the spore-peer cargo gates when a
# spore-peer checkout is present, the -race + cross-binary interop run with
# the freshly built Rust binary, and the doc-refs pin check. A failed gate
# blocks the push. For fast inner-loop runs use `scripts/gates.sh --quick`
# directly — the push gate stays the full suite by design.
#
# Escape hatches: LEFTHOOK=0 git push ...   or   git push --no-verify
pre-push:
  commands:
    gates:
      run: bash scripts/gates.sh
