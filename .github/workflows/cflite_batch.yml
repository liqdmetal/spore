name: ClusterFuzzLite batch fuzzing

# Batch mode: continuous fuzzing of main so a corpus builds up over time —
# this is where CFL outgrows the 15s fuzz-smoke gate. Scheduled (not on
# push) to keep every-push CI latency at the house budget.
#
# Storage: corpora persist to the cfl-corpus branch of THIS repo (same-repo
# storage per the docs' "Git repo for storage" section — no PAT needed when
# the storage repo is the workflow's own repo, so the default token carries
# exactly one repo's write scope instead of a repo-scoped PAT's all-repo
# scope). Git history is the retention mechanism: nothing expires at 90
# days the way run artifacts do.
#
# NOTE (per ClusterFuzzLite docs): batch fuzzing must be paired with corpus
# pruning — .github/workflows/cflite_cron.yml owns prune + coverage.
# 1h/day split across four targets ≈ the upstream default cadence for a
# project this size.

on:
  schedule:
    # 03:10 UTC daily — off the collision minutes (pin-freshness owns
    # Mondays 06:20 UTC; spore-peer-contract dispatches on demand).
    - cron: '10 3 * * *'
  # Manual dispatch so a fresh corpus can be forced after wiring a new
  # target or importing a regression corpus.
  workflow_dispatch: {}

permissions:
  # read-all + the storage write: batch mode uploads the corpus to the
  # cfl-corpus branch. contents: write is scoped to this repo only.
  contents: write

concurrency:
  # One batch run at a time: a delayed cron firing (GitHub's scheduler can
  # deliver schedules hours late) must not race an operator dispatch on the
  # cfl-corpus branch — two runs fetching, fuzzing, and pushing concurrently
  # would fail the second's corpus upload on a non-fast-forward. Queuing
  # (cancel-in-progress: false) keeps every firing's fuzz hours; a queued
  # run still downloads the freshest corpus at its start.
  group: cflite-batch
  cancel-in-progress: false

jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
        - address
    steps:
    - name: Build Fuzzers (${{ matrix.sanitizer }})
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: go
        sanitizer: ${{ matrix.sanitizer }}

    - name: Run Fuzzers (${{ matrix.sanitizer }})
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 3600
        mode: 'batch'
        sanitizer: ${{ matrix.sanitizer }}
        # output-sarif off: same permission reasoning as cflite_pr.yml.
        # Storage: same-repo branch (see header). Token embedded in the URL
        # per the docs' storage pattern; GitHub masks GITHUB_TOKEN in logs.
        storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/liqdmetal/spore.git
        storage-repo-branch: cfl-corpus
