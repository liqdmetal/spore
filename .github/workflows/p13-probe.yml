name: ReleaseG

permissions:
  contents: write
  id-token: write
  actions: read # required by the SLSA generator to detect the calling workflow

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build + Release (cross-platform)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: spore.exe
          - goos: linux
            goarch: amd64
            artifact: spore
          - goos: darwin
            goarch: amd64
            artifact: spore
          - goos: darwin
            goarch: arm64
            artifact: spore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ${{ matrix.artifact }} ./cmd/spore
      - name: Checksum
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            cp "$d"/* release/
          done
      # v2: v1 ran on the decommissioned node16 runtime, and GitHub now
      # refuses to start any workflow referencing it — the whole Release run
      # died at startup (startup_failure, no jobs, no logs) on every tag.
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hash:
    name: Hash artifacts for provenance
    needs: build
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Hash artifacts
        id: hash
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            cp "$d"/* release/
          done
          # generator_generic_slsa3 expects one "name sha256:digest" line per
          # subject, base64-encoded (NOT a JSON map).
          SUBJECTS=$(cd release && sha256sum * | awk '{print $2 " sha256:" $1}' | base64 -w0)
          echo "subjects=$SUBJECTS" >> "$GITHUB_OUTPUT"

  provenance:
    name: Provenance (SLSA)
    permissions:
      actions: read
      contents: read
      id-token: write
    # Reusable workflows may ONLY be invoked at the job level: a job with
    # `uses:` must not contain runs-on/steps. The previous version called the
    # generator from a step, so GitHub rejected this entire workflow at parse
    # time and every push produced a failed release run with no logs.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: "${{ needs.hash.outputs.subjects }}"