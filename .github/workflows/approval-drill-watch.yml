name: approval-drill-watch

# The cross-process approval hardening, made automatic — the same tripwire
# pattern as pin-freshness.yml and fork-parity-watch.yml, pointed at spore's
# own two-station guarantees instead of an external repo. The things it
# guards were all real bugs once: two stations racing one queue must never
# double-sign a nonce (TestApprovalTwoStationDrillNeverDoubleSign, real OS
# processes), the always-on station's self-metrics must reach stdout through
# the real binary in both render modes (TestWatchStationSelfMetricsLive),
# and the station health gate must pass on a healthy heartbeat and trip on
# an orphaned lock — in batch and in -w watch mode (scripts/station-health.sh,
# live-fired here).
#
# Daily 05:33 UTC (an off-the-minute slot, like the other sentinels). A red
# run is the primary flag; the tracking issue (marker
# <!-- approval-drill-watch -->, label approval-drill) is the durable,
# searchable one — opened on red, updated while red, auto-closed on green.
# ci.yml already runs the full suite on every push; this sentinel exists for
# the quiet weeks when nothing is pushed and the drill still has to run.

on:
  schedule:
    - cron: "33 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # append the drill heartbeat to the metrics branch
  issues: write

concurrency:
  group: approval-drill-watch
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Two-station double-sign drill (real OS processes)
        id: drill
        run: go test ./cmd/spore/ -run 'TestApprovalTwoStationDrillNeverDoubleSign' -count=1 -v

      - name: Watch station self-metrics live smoke (real binary, both render modes)
        id: smoke
        run: go test ./cmd/spore/ -run 'TestWatchStationSelfMetricsLive' -count=1 -v

      - name: Station health gate live fire (batch + watch mode)
        id: gate
        run: |
          go build -o /tmp/spore ./cmd/spore
          work="$(mktemp -d)"
          mkdir -p "$work/queue"
          # Healthy path: one real one-shot heartbeat over a fresh queue
          # must pass the gate (exit 0).
          /tmp/spore msg approval-metrics -dir "$work/queue" -envelope > "$work/station.jsonl"
          bash scripts/station-health.sh -f "$work/station.jsonl"
          # Negative control: an orphaned lock (no guarded request file)
          # must trip the gate — the gate that never trips is the bug.
          touch "$work/queue/orphan.lock"
          /tmp/spore msg approval-metrics -dir "$work/queue" -envelope | bash scripts/station-health.sh -f - && {
            echo "::error::station-health.sh did NOT trip on an orphaned lock"
            exit 1
          }
          # Watch mode (-w): a healthy heartbeat must keep the watcher
          # running and a violating heartbeat must stop it with exit 1 —
          # the FIFO/trap plumbing and exit-code propagation only get
          # exercised under a real follow. The orphaned lock from the
          # batch control is removed first so the healthy heartbeat is
          # genuinely healthy.
          rm -f "$work/queue/orphan.lock"
          : > "$work/watch.jsonl"
          bash scripts/station-health.sh -w -f "$work/watch.jsonl" >/dev/null 2>&1 &
          wpid=$!
          sleep 2
          /tmp/spore msg approval-metrics -dir "$work/queue" -envelope >> "$work/watch.jsonl"
          if ! kill -0 "$wpid" 2>/dev/null; then
            echo "::error::watch mode stopped on a healthy heartbeat"
            exit 1
          fi
          touch "$work/queue/orphan.lock"
          /tmp/spore msg approval-metrics -dir "$work/queue" -envelope >> "$work/watch.jsonl"
          for i in $(seq 1 10); do
            kill -0 "$wpid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$wpid" 2>/dev/null; then
            echo "::error::watch mode did not trip on an orphaned-lock heartbeat"
            kill "$wpid" 2>/dev/null || true
            exit 1
          fi
          rc=0
          wait "$wpid" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::watch trip exited $rc, want 1"
            exit 1
          fi
          # A tail failure in watch mode must exit 2, never a silent pass.
          bash scripts/station-health.sh -w -f "$work" >/dev/null 2>&1 && {
            echo "::error::watch mode exited 0 on a tail failure"
            exit 1
          }
          echo "health gate: batch + watch live-fired (healthy holds, trip exits 1, tail failure exits 2)"

      - name: Ensure the tracking label exists
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create approval-drill --repo "$GITHUB_REPOSITORY" \
            --description "scheduled approval drill went red" \
            --color D93F0B 2>/dev/null || true

      - name: Manage the tracking issue (open on red, close on green)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- approval-drill-watch -->';
            const ok = '${{ job.status }}' === 'success';
            const drill = '${{ steps.drill.outcome }}';
            const smoke = '${{ steps.smoke.outcome }}';
            const gate = '${{ steps.gate.outcome }}';
            const history = '${{ steps.history.outcome }}';
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo +
                           '/actions/runs/' + context.runId;
            const row = (name, outcome) => '| ' + name + ' | ' + outcome + ' |';
            const body = [
              'Approval drill report (scheduled sentinel):',
              '',
              '| check | result |',
              '|---|---|',
              row('two-station double-sign drill', drill),
              row('watch self-metrics live smoke', smoke),
              row('station health gate (batch + watch)', gate),
              row('drill history gate', history),
              '',
              ok
                ? 'All checks green. (This issue auto-closes.)'
                : 'A check went RED — see the run for logs: ' + runUrl,
              '',
              marker,
            ].join('\n');
            const q = 'repo:' + context.repo.owner + '/' + context.repo.repo +
                      ' is:issue is:open in:body "' + marker + '"';
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const num = found.data.items.length ? found.data.items[0].number : null;
            if (!ok) {
              if (num) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: num, body: 'Still red as of this run:\n\n' + body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'Approval drill went red on schedule',
                  body: body, labels: ['approval-drill'],
                });
              }
            } else if (num) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, body: 'Drill green again; auto-closing.\n\n' + body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, state: 'closed',
              });
            }

      # Durable, scrapeable drill history: every run appends one JSON line to
      # drill.jsonl on the `metrics` branch (data-only branch — no code, no
      # CI, no tags fire from it). Anyone can tail the history with
      #   curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/metrics/drill.jsonl
      # and grep for the last verdict. Red runs append too — history should
      # show them. Retention: every run truncates the file to its LAST 1000
      # lines (append-then-tail), so the JSONL never grows unbounded and an
      # oversized file self-heals on the next run. The step is continue-on-error so a history failure never
      # flips the drill's verdict (the issue above is the flag), but the
      # failure is announced with a ::error:: annotation — the first version
      # of this step failed silently that way (init path had no origin
      # remote, so the push died under set -e and the step looked green).
      - name: Append the drill heartbeat to the metrics branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DRILL: ${{ steps.drill.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          GATE: ${{ steps.gate.outcome }}
          VERDICT: ${{ job.status }}
        run: |
          set -euo pipefail
          repo_dir="$(mktemp -d)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch metrics "$url" "$repo_dir" 2>/dev/null; then
            touch "$repo_dir/drill.jsonl" # exists: append
          else
            # First run (or branch rotated away): create the data-only
            # branch. The fresh repo has NO remote — adding it is what the
            # first version missed, so the push silently died.
            git -c init.defaultBranch=metrics init -q "$repo_dir"
            git -C "$repo_dir" remote add origin "$url"
          fi
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          line=$(printf '{"at":"%s","source":"spore-approval-drill","run":"%s","url":"https://github.com/%s/actions/runs/%s","commit":"%s","drill":"%s","smoke":"%s","gate":"%s","verdict":"%s"}' \
            "$at" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "${DRILL:-skipped}" "${SMOKE:-skipped}" "${GATE:-skipped}" "${VERDICT}")
          printf '%s\n' "$line" >> "$repo_dir/drill.jsonl"
          # Retention cap: keep only the last 1000 heartbeats. Through a
          # temp file — `tail file > file` in place would truncate it to
          # nothing. Runs after the cap keep the file at exactly 1000; a
          # larger file (from before the cap) shrinks here too.
          tail -n 1000 "$repo_dir/drill.jsonl" > "$repo_dir/drill.jsonl.tmp"
          mv "$repo_dir/drill.jsonl.tmp" "$repo_dir/drill.jsonl"
          git -C "$repo_dir" add drill.jsonl
          git -C "$repo_dir" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "drill heartbeat ${GITHUB_RUN_ID} (${VERDICT})"
          if ! git -C "$repo_dir" push -q origin HEAD:metrics; then
            echo "::error::could not append the drill heartbeat to the metrics branch (drill verdict was ${VERDICT}; the tracking issue above remains the flag for red drills)"
            exit 1
          fi
          echo "heartbeat appended: $line"

      # Consume our own history: the gate that cron operators run against
      # drill.jsonl runs here too — a red verdict or a stale history (no
      # heartbeat for 48h) fails the run and opens the drill-history
      # tracking issue. The raw CDN may serve the second-older heartbeat
      # right after the push; harmless, a daily heartbeat is far inside the
      # 48h gate. Runs only when the heartbeat actually landed.
      - name: Consume the drill history (verdict + freshness gate)
        id: history
        if: always() && steps.heartbeat.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/drill-history-gate.sh --repo "$GITHUB_REPOSITORY"
