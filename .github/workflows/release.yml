name: Release

permissions:
  contents: write
  id-token: write
  actions: read # required by the SLSA generator to detect the calling workflow

on:
  push:
    tags:
      - "v*"
  # Dispatched dry-runs: exercises the full pipeline (cross-compile, subjects
  # hashing, keyless SLSA signing) with no tag created and nothing published.
  # The publish gates below key on `github.event_name == 'push'`, so a
  # dispatched run has NO publish path at all — no throwaway v0.0.0* tags
  # needed anymore (those briefly shipped artifacts on the public repo before
  # the gate existed).
  workflow_dispatch:

jobs:
  # The cross-binary wire contract as a PUBLISH GATE: the real spore-peer
  # binary (built at the audited pin in spore-peer-contract.yml) and the real
  # `spore fabric subscribe` binary gate the tagged commit — the §5 wire
  # contract, the fabric CLI roundtrip, and the F2 fabric-drain interop
  # (Go publish → Rust relay → subscribe drain → E2 ingest) all run here
  # before anything is released. `release` needs this job, so a red interop
  # skips publishing (the SLSA signing chain still runs — same policy as
  # workflow_dispatch dry-runs). Tag pushes never fire ci.yml (by design,
  # see its `on.push.branches`), so without this call the cross-binary tests
  # would not exist anywhere on the release path.
  wire-contract:
    name: spore-peer Rust + wire contract (release gate)
    uses: ./.github/workflows/spore-peer-contract.yml

  # Ship the transport, not just the client. The Rust spore-peer binaries are
  # built at the SAME audited pin the wire-contract job gates (extracted the
  # same way pin-freshness.yml extracts it), so the relay a home-node operator
  # downloads and the one the interop tests ran against are artifacts of one
  # commit. Without these assets a release cannot bootstrap the serverless
  # posture the README documents. Testing happened in the wire-contract job at
  # this same pin; these jobs only cross-build. Linux targets are musl (fully
  # static — runs on glibc distros, Alpine, and containers alike); Windows is
  # the gnu toolchain (mingw-w64 cross from Linux; msvc cannot cross from
  # ubuntu). Artifacts feed the same hash → provenance → release chain as the
  # Go matrix; names collide nowhere (spore-* vs spore-peer-*).
  build-rust:
    name: Build spore-peer (linux + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract the audited pin
        id: pin
        run: |
          pin="$(grep -o "'[0-9a-f]\{40\}'" .github/workflows/spore-peer-contract.yml | head -1 | tr -d "'")"
          if [ -z "$pin" ]; then
            echo "::error::could not extract the audited pin from spore-peer-contract.yml (looking for a 40-hex quoted literal on the SPORE_PEER_PIN default)"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out spore-peer at the gated commit
        run: |
          echo "building spore-peer@${{ steps.pin.outputs.pin }}"
          git clone --filter=blob:none --no-checkout https://github.com/liqdmetal/spore-peer.git spore-peer
          git -C spore-peer checkout "${{ steps.pin.outputs.pin }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu
          # aarch64-pc-windows-gnu is deliberately absent: Ubuntu ships no
          # aarch64 mingw cross-linker, and the lld workarounds are unstable
          # toolchain surface — not something a release pipeline should bet
          # on. Windows-on-ARM users get the Go `spore` binary (Go cross-
          # compiles it trivially); the peer transport for that platform
          # lands when the toolchain story is dependable.
      - name: Install cross linkers
        # musl: static link needs musl-gcc; mingw-w64 is usually preinstalled
        # on the runner image but installing it makes this job immune to
        # image drift.
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev mingw-w64
      - name: Point aarch64-musl at the bundled rust-lld
        # musl-tools ships a gcc for the host arch only — there is no
        # aarch64-linux-musl cross-gcc package to install. rust-lld ships
        # with the toolchain and links this pure-Rust crate fine.
        run: |
          mkdir -p spore-peer/.cargo
          cat > spore-peer/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "rust-lld"
          EOF
      - name: Build (all targets)
        working-directory: spore-peer
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu; do
            echo "=== $t ==="
            cargo build --release --locked --target "$t"
          done
      - name: Stage + checksum
        run: |
          mkdir -p stage
          cp spore-peer/target/x86_64-unknown-linux-musl/release/spore-peer stage/spore-peer-linux-amd64
          cp spore-peer/target/aarch64-unknown-linux-musl/release/spore-peer stage/spore-peer-linux-arm64
          cp spore-peer/target/x86_64-pc-windows-gnu/release/spore-peer.exe stage/spore-peer-windows-amd64.exe
          (cd stage && for f in spore-peer-*; do sha256sum "$f" > "$f.sha256"; done)
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: spore-peer-linux-windows
          path: stage/*

  # The apple targets cannot cross from Linux (no Darwin SDK/linker), but
  # macOS runners cross-compile between arm64 and x86_64 natively — one
  # macos-latest (arm64) runner builds both with the same --target pattern.
  build-rust-darwin:
    name: Build spore-peer (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract the audited pin
        id: pin
        run: |
          pin="$(grep -o "'[0-9a-f]\{40\}'" .github/workflows/spore-peer-contract.yml | head -1 | tr -d "'")"
          if [ -z "$pin" ]; then
            echo "::error::could not extract the audited pin from spore-peer-contract.yml (looking for a 40-hex quoted literal on the SPORE_PEER_PIN default)"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out spore-peer at the gated commit
        run: |
          echo "building spore-peer@${{ steps.pin.outputs.pin }}"
          git clone --filter=blob:none --no-checkout https://github.com/liqdmetal/spore-peer.git spore-peer
          git -C spore-peer checkout "${{ steps.pin.outputs.pin }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build (all targets)
        working-directory: spore-peer
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "=== $t ==="
            cargo build --release --locked --target "$t"
          done
      - name: Stage + checksum
        run: |
          mkdir -p stage
          cp spore-peer/target/aarch64-apple-darwin/release/spore-peer stage/spore-peer-darwin-arm64
          cp spore-peer/target/x86_64-apple-darwin/release/spore-peer stage/spore-peer-darwin-amd64
          (cd stage && for f in spore-peer-*; do shasum -a 256 "$f" > "$f.sha256"; done)
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: spore-peer-darwin
          path: stage/*

  build:
    name: Build + Release (cross-platform)
    runs-on: ubuntu-latest
    # Distinct per-platform file names: the release/hash jobs flatten all
    # matrix artifacts into one directory, so bare "spore" from linux and
    # both darwin targets would overwrite each other (found by v0.0.0-ci).
    env:
      BIN: spore-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          # Windows-on-ARM (Surface, Snapdragon laptops): pure Go, same CGO_ENABLED=0 build.
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          # Raspberry Pi-class home nodes run 64-bit OSes now — the always-on
          # mailbox/relay posture is exactly the arm64 box this target serves.
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        # Released binaries stamp the tag; dispatched dry-run binaries stamp
        # a `dry-run-*` version so they can never be mistaken for a release.
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${{ github.event_name == 'push' && github.ref_name || format('dry-run-{0}', github.ref_name) }}" -o "$BIN" ./cmd/spore
      - name: Checksum
        run: sha256sum "$BIN" > "$BIN.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BIN }}
          path: |
            ${{ env.BIN }}
            ${{ env.BIN }}.sha256

  release:
    name: Create GitHub Release
    # The wire contract gates the publish: a red interop (or red Rust build)
    # skips the Release step entirely. build is still needed on its own so a
    # dry-run's artifact chain (hash → detached provenance signing) remains
    # complete when the gate skips nothing. build-rust needs wire-contract so
    # the shipped relay binaries can never come from a pin the interop
    # refused (contract is a same-ref reusable call, so its checkout is this
    # same commit).
    needs: [build, build-rust, build-rust-darwin, wire-contract]
    # Publishes only on real tag pushes. workflow_dispatch is a dry-run: the
    # gate keys on the trigger event, so a dispatched run cannot publish.
    # Build, subjects hashing, and detached keyless signing still run.
    # The v0.0.0* clause stays as a second belt: throwaway tags are retired,
    # but if one is ever pushed again it must still never publish.
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.0') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Prepare release
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            cp "$d"/* release/
          done
      # v2: v1 ran on the decommissioned node16 runtime, and GitHub now
      # refuses to start any workflow referencing it — the whole Release run
      # died at startup (startup_failure, no jobs, no logs) on every tag.
      # v3: v2 targeted the deprecated Node 20 runtime (force-upgraded with
      # warnings on every run); v3 is the node24 major.
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hash:
    name: Hash artifacts for provenance
    needs: [build, build-rust, build-rust-darwin]
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Hash artifacts
        id: hash
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            cp "$d"/* release/
          done
          # generator_generic_slsa3's attest takes a standard `sha256sum`
          # subjects file, base64-encoded: "<digest>  <name>" per line
          # (generic.go parses field 1 as the digest). The earlier awk
          # transform to "name sha256:digest" was exactly backwards — attest
          # failed with "sha: unexpected sha256 hash format" on every tag
          # (found by v0.0.0-ci). Exclude the *.sha256 checksum files: their
          # own content is not a sha256sum line either.
          SUBJECTS=$(cd release && find . -maxdepth 1 -type f ! -name '*.sha256' -print0 | xargs -0 sha256sum | base64 -w0)
          echo "subjects=$SUBJECTS" >> "$GITHUB_OUTPUT"

  provenance:
    name: Provenance (SLSA)
    # Gated on the wire contract too: a red interop on a tag skips this job
    # (alongside `release`), so the generator never tries to upload signed
    # assets for a release the gate refused. Needs failure skips dependents
    # by default — no expression needed here.
    needs: [hash, wire-contract]
    # NOTE: no job-level `permissions:` here. Empirically (14-probe bisect,
    # v0.0.0-ci exercise), GitHub startup-fails ANY workflow that sets
    # permissions on a `uses:` job — even though some docs suggest it is
    # valid. The called generator inherits this workflow's top-level
    # permissions, which already grant exactly what it needs:
    # id-token: write (OIDC), actions: read (caller detection),
    # contents: read (implied by write).
    # Reusable workflows may ONLY be invoked at the job level: a job with
    # `uses:` must not contain runs-on/steps. The previous version called the
    # generator from a step, so GitHub rejected this entire workflow at parse
    # time and every push produced a failed release run with no logs.
    # v2.1.0: the v1.9.0 line pins actions/upload-artifact v3 internally,
    # which GitHub now auto-fails (deprecated runtime) — the generator job
    # died before doing anything. v2 uses the v4 artifact actions.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.subjects }}"
      # Attach the signed provenance to the GitHub Release: the generator
      # uploads only when upload-assets is true AND the workflow runs on a
      # v* tag push. Dispatched dry-runs (and any v0.0.0* tag) set this
      # false — nothing is published; the signing chain still runs detached.
      upload-assets: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.0') }}

  # Verify the release the way a consumer would: download the published
  # Release assets (not build intermediates), then check every binary against
  # the signed provenance that was actually attached to that Release. On
  # dry-runs (workflow_dispatch or v0.0.0* tags) `release` is gated off, so
  # this verifies OFFLINE instead: the run's own artifacts (binaries + the
  # signed provenance) are downloaded and checked without tag binding — the
  # verifier's --source-tag is optional; --source-uri is still enforced — so
  # the consumer check is exercised on every dry-run with nothing published.
  # A red run here means consumers running slsa-verifier would reject it.
  # Job-level permissions are fine on a normal job (the startup quirk noted
  # above applies only to `uses:` jobs); this job needs no write access.
  verify-provenance:
    name: Verify provenance (slsa-verifier)
    needs: [release, provenance, wire-contract]
    # Run on real releases (consumer path) and on dry-runs, where `release`
    # is skipped (offline path). A FAILED `release` still skips this job:
    # its own redness is the signal and the consumer download would just
    # double-fail confusingly. The wire-contract clause covers a gate-failed
    # tag: provenance skipped with the gate, so there is no provenance file
    # and the offline path must not run — the red gate IS the signal.
    if: ${{ !cancelled() && needs.wire-contract.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin the verifier binary to the official v2.7.0 release and check its
      # sha256 before use (computed from the official release asset), so the
      # tooling doing the verification has a known-good identity.
      - name: Install slsa-verifier (hash-pinned)
        run: |
          VERIFIER="$RUNNER_TEMP/slsa-verifier-linux-amd64"
          curl -fsSLo "$VERIFIER" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64"
          echo "499befb675efcca9001afe6e5156891b91e71f9c07ab120a8943979f85cc82e6  $VERIFIER" | sha256sum -c -
          chmod +x "$VERIFIER"
      - name: Download release assets (consumer-style)
        # Release path only: on dry-runs there is no release to download and
        # the artifact download below populates the same layout instead.
        if: ${{ needs.release.result == 'success' }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      - name: Download run artifacts (offline dry-run)
        if: ${{ needs.release.result == 'skipped' }}
        run: |
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir download_tmp
          # gh run download nests one subdirectory per artifact — and those
          # dir names EQUAL the binary names inside (spore-darwin-amd64/
          # spore-darwin-amd64), so flattening in place would mv a file onto
          # a directory of the same name and fail. Flatten into the separate
          # release/ tree instead.
          find download_tmp -mindepth 2 -type f -exec mv {} release/ \;
          find download_tmp -mindepth 1 -type d -empty -delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
      - name: Verify every binary against the signed provenance
        run: |
          PROV=release/multiple.intoto.jsonl
          test -f "$PROV"
          # Binaries only: the *.sha256 checksum files and the provenance
          # itself are not provenance subjects. Fail loudly if this ever
          # matches nothing instead of verifying an empty set.
          BINARIES=$(find release -maxdepth 1 -type f \
            ! -name '*.sha256' ! -name '*.intoto.jsonl')
          test -n "$BINARIES"
          # word splitting is intentional: one verifier invocation covers all
          # binaries, which must all be subjects of the same provenance file.
          # Tag binding only applies to real releases; dry-runs have no tag.
          EXTRA=""
          if [ -n "$SOURCE_TAG" ]; then EXTRA="--source-tag $SOURCE_TAG"; fi
          "$RUNNER_TEMP/slsa-verifier-linux-amd64" verify-artifact $BINARIES \
            --provenance-path "$PROV" \
            --source-uri "github.com/$GITHUB_REPOSITORY" \
            $EXTRA
        env:
          SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}