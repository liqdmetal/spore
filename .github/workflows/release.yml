name: release

# A tag push builds the six Go targets, publishes them with checksums, and
# attaches SLSA provenance (multiple.intoto.jsonl) signed by the SLSA generic
# generator. Re-running on an existing release replaces its assets
# (--clobber) rather than failing, so a bad build can be fixed without moving
# the tag.
#
# Not built here: spore-peer / spore-iroh. They are Rust and need their own
# targets and cross toolchains; this workflow covers the Go messenger only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: spore-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          out="spore-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" ./cmd/spore/
          sha256sum "$out" > "${out}.sha256"
          # the one artifact this runner can execute is the smoke test
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then ./"$out" version; fi

      - uses: actions/upload-artifact@v4
        with:
          name: spore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            spore-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS and provenance subjects
        id: hash
        run: |
          set -euo pipefail
          cd dist
          sha256sum $(find . -maxdepth 1 -type f -name 'spore-*' ! -name '*.sha256' -printf '%f\n' | sort) > SHA256SUMS
          cat SHA256SUMS
          # base64 of the sha256sum lines: the generator's subjects input
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing its assets"
            # A dispatch run republishes no provenance, and the binary digests
            # are about to change: an attestation left in place would describe
            # artifacts that no longer exist. Remove it first.
            if [ "$IS_DISPATCH" = "1" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                --jq '.assets[] | select(.name | endswith(".intoto.jsonl")) | .id' |
              while read -r asset_id; do
                [ -n "$asset_id" ] || continue
                echo "removing stale provenance asset ${asset_id}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
              done
            fi
            gh release upload "$TAG" dist/* --clobber
          elif ! gh release create "$TAG" dist/* --title "$TAG" --notes-from-tag; then
            # lightweight tags carry no message; fall back to generated notes
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

      - name: Note skipped provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "::notice::provenance skipped: a workflow_dispatch run attests ${GITHUB_REF}, not tag ${TAG}"

  provenance:
    name: slsa-provenance
    needs: [checksums, publish]
    # Only a tag push attests the tag itself. A workflow_dispatch run executes
    # from main, so its provenance would claim refs/heads/main while the assets
    # belong to a tag — refuse to publish that.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      id-token: write
      contents: write
    # must be referenced by a full semver tag — the generator enforces it
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.checksums.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.event.inputs.tag || github.ref_name }}
