name: ClusterFuzzLite cron tasks

# Housekeeping required by the batch workflow (ClusterFuzzLite docs: batch
# fuzzing must be paired with pruning — an unpruned corpus grows without
# bound and slows every subsequent batch run). Coverage reports are omitted
# for now: they only pay off with a storage-repo + gh-pages to publish to,
# which is deliberately not configured yet.

on:
  schedule:
    # Once a day, after the 03:10 UTC batch run has landed.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions: read-all

jobs:
  Pruning:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: go

    - name: Run Fuzzers (prune)
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 600
        mode: 'prune'
