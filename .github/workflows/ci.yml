name: CI

permissions:
  contents: read


on:
  # Pushes to main and PRs run the FAST gate — the five jobs named in `jobs:`
  # below: build+vet+test, the three static/doc gates, and the stub-chain
  # rehearsal smoke (the one integration job whose inputs an ordinary commit
  # can change). Tag pushes don't run CI at all: a tag fires the Release
  # workflow, whose pipeline is the tag's gate, and the tagged commit's CI
  # already ran when it landed on main, so running CI on the tag ref only ever
  # duplicated that run. PRs run on their merge-refs; the concurrency group
  # still cancels superseded runs on the same ref. workflow_dispatch runs the
  # remaining expensive jobs on demand.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Weekly, for the two jobs whose inputs decay without any new code: fuzz-smoke
  # (a parser bug reachable from a mutated input) and govulncheck (a CVE
  # published against code that never changed). Monday 06:40 UTC, clear of
  # pin-freshness (06:20) and fork-parity-watch (06:47).
  schedule:
    - cron: '40 6 * * 1'

# Cancel superseded PR runs (same branch, newer commit) instead of letting
# stale runs grind to completion.
concurrency:
  # Scoped per event as well as per ref: with one group shared across events,
  # the weekly run could cancel an in-flight push run (a cancelled check is not
  # a passing one), or be cancelled by the next push before it reports.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHICH JOBS AN ORDINARY PUSH RUNS IS A DELIBERATE CHOICE, NOT ALL OF THEM.
  # A push to main or a PR spends minutes on five: this build/vet/test job, the
  # three fast static/doc gates further down, and the stub-chain rehearsal
  # smoke. The rehearsal smoke earns its place on every push because it is the
  # only automated exercise of the funded receive path — it drives the real CLI
  # (evm-proxy, contract deploy/estimate, msg send-e2/recv-e2, and the unlogged
  # burn plus its chain-state recovery) against tools/sepoliastub, so an
  # ordinary flag rename or ABI drift fails here instead of at the next real
  # rehearsal. Everything else is expensive per run — two Windows runners, the
  # race pass, the Rust wire-contract build, ten fuzz targets, two release
  # builds and their manifest, and a network vuln scan — and most commits
  # cannot change any of it. Those jobs run on demand (Actions -> CI -> Run
  # workflow) and, for fuzz-smoke and govulncheck, on the weekly schedule
  # above.
  #
  # A skipped job reports as SKIPPED, and GitHub counts a skipped required check
  # as passing, so a branch rule that names any of them cannot hang on a push
  # that skipped it. Nothing here is deleted: the definitions stay, and a
  # dispatch runs the whole set exactly as a push used to.
  #
  # First signal: the fast, uninstrumented suite. Build/vet/test breakage
  # surfaces here in minutes; the -race jobs then double-check the same commit
  # under the race detector when they are run.
  test:
    name: build + vet + test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # Pin to the repo's own go.mod directive so CI and dev never drift.
          go-version-file: go.mod
          # Built-in module/build cache is keyed off go.mod/go.sum.
      - name: Build
        run: go build ./...
      - name: Vet
        # Blocking: vet is currently clean, keep it that way.
        run: go vet ./...
      - name: Test
        run: go test ./...

  # The race pass runs as its own job so its slower instrumented build never
  # gates the fast signal above. spore is networky (mailbox host, peers) —
  # race detection is cheap here and catches the cross-goroutine bugs that
  # matter most. Build and vet already passed on this exact commit in `test`.
  test-race:
    name: build + vet + test -race
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test (race)
        # -race recompiles everything it needs; no separate build/vet steps.
        run: go test -race ./...

  windows:
    name: Windows build + vet + test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  windows-race:
    name: Windows test -race
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test (race)
        # Same commit already built and vetted on Windows by `windows`.
        run: go test -race ./...

  # The other half of the wire contract: liqdmetal/spore-peer (Rust) is the
  # reference transport spore's peerstore speaks (WIRE_SPEC §5). The job body
  # lives only in spore-peer-contract.yml — the same definition also gates
  # spore-peer pushes via repository_dispatch — so the two call sites cannot
  # drift apart. The audited pin lives in that file too.
  spore-peer:
    name: spore-peer Rust + wire contract
    # Also dispatched by the peer repo itself (repository_dispatch in
    # spore-peer-contract.yml), so the cross-repo contract still fires on a
    # spore-peer push even though a spore push no longer runs it.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/spore-peer-contract.yml

  # The Phase A runbook can bit-rot silently: it drives spore's real CLI
  # (evm-proxy, contract deploy/estimate, msg send-e2/recv-e2, and the
  # unlogged burn plus its chain-state recovery) against an RPC surface no
  # unit test pretends to be. This smoke runs the ENTIRE
  # scripts/sepolia_rehearsal.sh against tools/sepoliastub (a stateful
  # MyceliumMailbox simulator whose selectors and ABI shapes are computed
  # from the same signatures internal/evm encodes) plus a local derosim
  # store — no faucet, no relays, fully offline. The script's own ~18
  # assertions are the gate: a CLI flag rename, a log-line rewording, or an
  # ABI drift fails here instead of at the next real rehearsal. It runs on
  # every push and PR: the funded run needs two faucet-funded keys, so this is
  # the only place the wiring is exercised end to end without a human
  # dispatching it.
  rehearsal-smoke:
    name: sepolia rehearsal smoke (stub chain)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build spore + stub
        run: |
          go build -o /tmp/smoke/spore ./cmd/spore
          go build -o /tmp/smoke/sepoliastub ./tools/sepoliastub
      - name: Start stub chain + derosim + mailbox host
        run: |
          set -e
          /tmp/smoke/sepoliastub 127.0.0.1:8532 > /tmp/smoke/stub.log 2>&1 &
          /tmp/smoke/spore derosim serve -listen 127.0.0.1:8612 > /tmp/smoke/derosim.log 2>&1 &
          mkdir -p /tmp/smoke/users/me
          echo '{"me":"rehearsal-secret"}' > /tmp/smoke/tokens.json
          /tmp/smoke/spore mailbox host \
            -users /tmp/smoke/users -tokens /tmp/smoke/tokens.json \
            -listen 127.0.0.1:8611 -chain dero -rpc http://127.0.0.1:8612/w/alice \
            > /tmp/smoke/mailbox.log 2>&1 &
          for port in 8532 8611 8612; do
            for i in $(seq 1 30); do
              curl -s -o /dev/null --connect-timeout 2 "http://127.0.0.1:$port/" && break
              sleep 1
            done
            curl -s -o /dev/null --connect-timeout 2 "http://127.0.0.1:$port/" || {
              echo "service on $port never came up"; exit 1; }
          done
      - name: Run the rehearsal script against the stub
        env:
          SPORE_EVM_PRIVATE_KEY:   "0x1111111111111111111111111111111111111111111111111111111111111111"
          SPORE_EVM_PRIVATE_KEY_B: "0x2222222222222222222222222222222222222222222222222222222222222222"
          SPORE_REHEARSAL_STORE: "http://127.0.0.1:8611/u/me"
          SPORE_REHEARSAL_STORE_TOKEN: "rehearsal-secret"
        run: |
          set -o pipefail
          bash scripts/sepolia_rehearsal.sh -r http://127.0.0.1:8532 -b /tmp/smoke/spore \
            | tee /tmp/smoke/rehearsal.log
          grep -q 'rehearsal complete' /tmp/smoke/rehearsal.log
      - name: Upload rehearsal logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rehearsal-smoke-logs
          path: /tmp/smoke/*.log
          retention-days: 7

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # One target finding a crash must not mask the others.
      fail-fast: false
      matrix:
        include:
          - package: ./internal/continuity
            target: FuzzContinuityArtifactParsers
          - package: ./internal/anchor
            target: FuzzFromArguments
          # wirefuzz: the standalone SPR2 parser targets. Mirrored by
          # ClusterFuzzLite (.clusterfuzzlite/) and the oss-fuzz fork's
          # projects/spore — keep all three target lists in sync.
          - package: ./internal/wirefuzz
            target: FuzzFrameParse
          - package: ./internal/wirefuzz
            target: FuzzHandshakeUnmarshal
          - package: ./internal/wirefuzz
            target: FuzzMessageUnmarshal
          - package: ./internal/wirefuzz
            target: FuzzFabricRPC2Frame
          # ratchetwire: the restored SecureWire seam targets (pin
          # enforcement, durable state, full roundtrip).
          - package: ./internal/ratchetwire
            target: FuzzWireRoundtrip
          - package: ./internal/ratchetwire
            target: FuzzWirePinEnforcement
          - package: ./internal/ratchetwire
            target: FuzzWireMalformedFrames
          - package: ./internal/ratchetwire
            target: FuzzDurableEndpointRoundtrip
          - package: ./internal/ratchetwire
            target: FuzzEndpointFullRoundTrip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }} (15s smoke)
        # Anchored -fuzz pattern: must match exactly one target per package.
        run: go test ${{ matrix.package }} -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=15s


  windows-release:
    name: Windows release binary
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release binary
        run: go build -ldflags="-s -w" -o dist/spore.exe ./cmd/spore
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: spore-windows-amd64
          path: dist/spore.exe
          retention-days: 7

  linux-release:
    name: Linux release binary
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/spore ./cmd/spore
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: spore-linux-amd64
          path: dist/spore
          retention-days: 7

  release-manifest:
    name: Release manifest
    if: github.event_name == 'workflow_dispatch'
    needs: [windows-release, linux-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: spore-*
          path: dist/
      - name: Generate SHA256 manifest
        # download-artifact (v4 through v7) nests each artifact in its own
        # subdirectory
        # (dist/spore-windows-amd64/spore.exe, ...). A flat `sha256sum *`
        # matches those DIRECTORY names too and exits 1. Flatten every file
        # up one level, drop the emptied dirs, then hash only top-level files.
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          find . -maxdepth 1 -type f -name 'spore*' -print0 | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: spore-SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
  gofmt:
    name: gofmt (blocking gate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        # Blocking since the backlog was drained: any file gofmt would
        # rewrite fails the build immediately.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

  audit-refs:
    name: audit doc commit refs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The audit docs pin findings to the commits that fixed them; the
          # check below resolves each cited hash against history, so a
          # shallow clone would report everything missing.
          fetch-depth: 0
      - name: Verify every commit hash cited in the manifest docs resolves
        # Fails on typos, rebases, stale pins, and ambiguous short hashes
        # (.github/actions/doc-refs; mark a non-commit hex string with
        # `no-verify-hash` on its line). Manifest: docs/refs.yml.
        uses: ./.github/actions/doc-refs

  goimports:
    name: goimports (import-section gate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check import grouping
        # goimports = gofmt + canonical import sectioning (stdlib /
        # third-party / module-internal groups, alphabetized) — the layer
        # gofmt deliberately does not enforce. Pinned to v0.28.0: the newest
        # release whose go directive the repo's Go 1.23 satisfies, so CI
        # doesn't silently toolchain-switch the way @latest does.
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.28.0
          unformatted=$("$(go env GOPATH)/bin/goimports" -l .)
          if [ -n "$unformatted" ]; then
            echo "goimports would rewrite:" "$unformatted"
            "$(go env GOPATH)/bin/goimports" -d $unformatted
            exit 1
          fi

  govulncheck:
    name: govulncheck (reachable vulns gate)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan for reachable vulnerabilities
        # Blocking at the SYMBOL level, which is what govulncheck exists to
        # answer: "your code is affected" findings fail this job (verified
        # exit 1 against a probe module calling a vulnerable symbol), while
        # package/module-level notices for code spore never calls are
        # printed but exit 0. Baseline at gate creation: 0 affecting.
        # Pinned to v1.8.0 like every tool pin in this file — @latest would
        # silently toolchain-switch the analysis binary to whatever Go
        # x/vuln's go.mod demands, divorcing the scan from the repo's own
        # toolchain. GOTOOLCHAIN=local enforces that: if a future x/vuln
        # needs a newer Go than the repo, the install fails loudly and the
        # pin gets bumped deliberately, exactly like goimports@v0.28.0.
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
