name: CI

permissions:
  contents: read


on:
  # Every push runs the gate. (Was main-only when the repo was private and
  # Actions minutes cost money; spore is public now. PR branches run twice —
  # push event + PR merge-ref event — which is free, and the concurrency
  # group still cancels superseded runs on the same ref.)
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs (same branch, newer commit) instead of letting
# stale runs grind to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + vet + test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the repo's own go.mod directive so CI and dev never drift.
          go-version-file: go.mod
          # Built-in module/build cache is keyed off go.mod/go.sum.
      - name: Build
        run: go build ./...
      - name: Vet
        # Blocking: vet is currently clean, keep it that way.
        run: go vet ./...
      - name: Test (race)
        # spore is networky (mailbox host, peers) — race detection is cheap
        # here and catches the cross-goroutine bugs that matter most.
        run: go test -race ./...

  windows:
    name: Windows build + vet + test (race)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # One target finding a crash must not mask the others.
      fail-fast: false
      matrix:
        include:
          - package: ./internal/continuity
            target: FuzzContinuityArtifactParsers
          - package: ./internal/anchor
            target: FuzzFromArguments
          # ratchetwire: the wire codec plus the restored SecureWire seam
          # targets (pin enforcement, durable state, full roundtrip).
          - package: ./internal/ratchetwire
            target: FuzzFrameParse
          - package: ./internal/ratchetwire
            target: FuzzHandshakeUnmarshal
          - package: ./internal/ratchetwire
            target: FuzzMessageUnmarshal
          - package: ./internal/ratchetwire
            target: FuzzWireRoundtrip
          - package: ./internal/ratchetwire
            target: FuzzWirePinEnforcement
          - package: ./internal/ratchetwire
            target: FuzzWireMalformedFrames
          - package: ./internal/ratchetwire
            target: FuzzDurableEndpointRoundtrip
          - package: ./internal/ratchetwire
            target: FuzzEndpointFullRoundTrip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }} (15s smoke)
        # Anchored -fuzz pattern: must match exactly one target per package.
        run: go test ${{ matrix.package }} -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=15s


  windows-release:
    name: Windows release binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binary
        run: go build -ldflags="-s -w" -o dist/spore.exe ./cmd/spore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spore-windows-amd64
          path: dist/spore.exe
          retention-days: 7

  linux-release:
    name: Linux release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/spore ./cmd/spore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spore-linux-amd64
          path: dist/spore
          retention-days: 7

  release-manifest:
    name: Release manifest
    needs: [windows-release, linux-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: spore-*
          path: dist/
      - name: Generate SHA256 manifest
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spore-SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
  gofmt:
    name: gofmt (blocking gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        # Blocking since the backlog was drained: any file gofmt would
        # rewrite fails the build immediately.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

  goimports:
    name: goimports (import-section gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check import grouping
        # goimports = gofmt + canonical import sectioning (stdlib /
        # third-party / module-internal groups, alphabetized) — the layer
        # gofmt deliberately does not enforce. Pinned to v0.28.0: the newest
        # release whose go directive the repo's Go 1.23 satisfies, so CI
        # doesn't silently toolchain-switch the way @latest does.
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.28.0
          unformatted=$("$(go env GOPATH)/bin/goimports" -l .)
          if [ -n "$unformatted" ]; then
            echo "goimports would rewrite:" "$unformatted"
            "$(go env GOPATH)/bin/goimports" -d $unformatted
            exit 1
          fi
